[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "jobs*"]

[project]
name = "spy-market-lens"
version = "0.1.0"
description = "SPY moving-average backtests and news-annotated market events (Streamlit portfolio app)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "yfinance>=1.7",
    "streamlit>=1.65,<2",
    "plotly>=7.1",
    "tenacity>=9.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]  # original 2022 EDA, kept unmodified for history
