name: nightly

on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays ~21:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m jobs.refresh_prices
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.parquet data/meta.json
          # Uses the default GITHUB_TOKEN (checkout's default) to push, which does NOT
          # trigger ci.yml's push event per GitHub's own docs on GITHUB_TOKEN-authored
          # pushes. ci.yml's paths-ignore: data/** is defense in depth in case a PAT
          # is ever substituted here. The commit message intentionally carries no
          # special CI-bypass marker tag (D-15).
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: nightly price refresh"
            git push
          fi
